<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수업 게임 모음</title>
<link rel="icon" href="card/img/icon-192.png">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;background:#1d1a24;color:#f3eee4;
    font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;padding:4vh 4vw}
  h1{margin:0;font-size:clamp(26px,5vh,44px);letter-spacing:.04em}
  p.sub{margin:-2vh 0 0;color:#b9b1a3;font-size:clamp(14px,2.4vh,19px)}
  .games{display:flex;gap:3vw;flex-wrap:wrap;justify-content:center}
  .game{width:min(40vw,430px);min-width:260px;border-radius:16px;padding:3.2vh 2.4vw;display:flex;flex-direction:column;gap:1.6vh;text-decoration:none;color:inherit;
    box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .15s}
  .game:hover{transform:translateY(-4px)}
  .game h2{margin:0;font-size:clamp(22px,4vh,34px)}
  .game .desc{margin:0;font-size:clamp(14px,2.3vh,18px);line-height:1.55;opacity:.9}
  .game .go{margin-top:auto;align-self:flex-start;padding:1.2vh 2.2vw;border-radius:10px;font-weight:700;font-size:clamp(16px,2.8vh,22px)}
  .card{background:linear-gradient(160deg,#2b2117,#120d09);border:2px solid #b8862b}
  .card h2{color:#f2b84b}.card .go{background:linear-gradient(#f7d07a,#c98a2b);color:#2a1a08}
  .chosung{background:linear-gradient(160deg,#2f5a3a,#1e3d27);border:2px solid #a7c4a0}
  .chosung h2{color:#fdf8e8}.chosung .go{background:#f4f1e8;color:#2f5a3a}
  .catchmind{background:linear-gradient(160deg,#fffdf9,#efe4d3);border:2px solid #5d4037;color:#3e2c23}
  .catchmind h2{color:#5d4037}.catchmind .go{background:#e07a5f;color:#fff}
  .teacher{position:fixed;left:2vw;bottom:3vh;color:#cfc6b6;font-size:clamp(13px,2.2vh,17px);background:rgba(0,0,0,.35);border:1px dashed rgba(255,255,255,.35);
    border-radius:8px;padding:1vh 1.4vw;text-decoration:none;cursor:pointer}
  .tmenu{position:fixed;left:2vw;bottom:9vh;display:none;flex-direction:column;gap:8px;background:#2a2533;border:1px solid #555;border-radius:10px;padding:10px}
  .tmenu.on{display:flex}.tmenu a{color:#f3eee4;text-decoration:none;padding:6px 10px;border-radius:6px;background:rgba(255,255,255,.06)}
</style>
</head>
<body>
  <h1>수업 게임 모음</h1>
  <p class="sub">하고 싶은 게임을 눌러 주세요</p>
  <div class="games">
    <a class="game card" href="card/">
      <h2>수학 카드 대전</h2>
      <p class="desc">6학년 수학 문제를 풀어 카드를 모으고,<br>나만의 덱으로 친구와 1:1 대결!</p>
      <span class="go">입장하기</span>
    </a>
    <a class="game chosung" href="chosung/">
      <h2>초성 퀴즈</h2>
      <p class="desc">초성에 맞는 낱말을 떠올려요.<br>개인전과 모둠 대항전</p>
      <span class="go">입장하기</span>
    </a>
    <a class="game catchmind" href="catchmind/">
      <h2>스케치북 캐치마인드</h2>
      <p class="desc">친구가 그리는 그림을 보고<br>제시어를 빨리 맞혀요!</p>
      <span class="go">입장하기</span>
    </a>
  </div>
  <a class="teacher" id="tbtn">교사모드</a>
  <div class="tmenu" id="tmenu"><a href="card/teacher">수학 카드 대전 · 교사 화면</a><a href="chosung/teacher">초성 퀴즈 · 교사 화면</a><a href="catchmind/teacher">캐치마인드 · 교사 화면</a></div>
  <script>document.getElementById('tbtn').onclick = () => document.getElementById('tmenu').classList.toggle('on');</script>
</body>
</html>
